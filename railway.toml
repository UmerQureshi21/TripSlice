# Backend service (Spring Boot). Railway service settings: root directory = repo root
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["src/**", "pom.xml", "Dockerfile"]

[deploy]
healthcheckPath = "/actuator/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
# Give in-flight uploads and montages time to finish on redeploy (matches spring.lifecycle.timeout-per-shutdown-phase)
overlapSeconds = 30
drainingSeconds = 60
