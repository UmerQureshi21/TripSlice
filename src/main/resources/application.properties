spring.application.name=TripSlice
spring.config.import=optional:classpath:application-secrets.properties

# Railway (and most hosts) inject PORT
server.port=${PORT:8080}
# Lets an in-flight upload or montage finish before a redeploy stops the container
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=60s
# Header the platform proxy sets to the real client IP, used for per-IP rate limits.
# On Railway set CLIENT_IP_HEADER=X-Real-IP. Empty means use the socket address
ratelimit.client-ip-header=${CLIENT_IP_HEADER:}

spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5436/postgres}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:umerqureshi}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
# Set JPA_DDL_AUTO=validate in production once the schema has been migrated
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

frontend.host=${FRONTEND_HOST:http://localhost:5173}

aws.region=${AWS_REGION:us-east-1}
aws.bucket.name=${AWS_S3_BUCKET:tidier}
# Optional ~/.aws profile name for local development. Leave unset in production and use
# AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY for the restricted tripslice-backend user instead
aws.profile=${AWS_PROFILE:}

# TwelveLabs credentials live in the Python AI service (ai-service/.env)
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}
ai.service.key=${AI_SERVICE_KEY}
jwt.secret=${JWT_SECRET}

# Optional Cloudflare Turnstile on sign up. Leave empty to disable (local dev)
turnstile.secret=${TURNSTILE_SECRET:}

# Only the health endpoint is exposed, for the platform health check
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# FFmpeg: how many encodes may run at once, and how long one may take
ffmpeg.max-concurrent=${FFMPEG_MAX_CONCURRENT:2}
ffmpeg.timeout-seconds=${FFMPEG_TIMEOUT_SECONDS:300}

# Per user, per UTC day. These cap TwelveLabs spend from any one account
limits.daily.analyze-calls=${LIMIT_DAILY_ANALYZE_CALLS:30}
limits.daily.searches=${LIMIT_DAILY_SEARCHES:100}
limits.daily.montages=${LIMIT_DAILY_MONTAGES:10}

# Per UTC day across all users combined, a hard ceiling on TwelveLabs spend however many accounts exist
limits.global-daily.analyze-calls=${LIMIT_GLOBAL_DAILY_ANALYZE_CALLS:300}
limits.global-daily.searches=${LIMIT_GLOBAL_DAILY_SEARCHES:2000}
limits.global-daily.montages=${LIMIT_GLOBAL_DAILY_MONTAGES:100}
